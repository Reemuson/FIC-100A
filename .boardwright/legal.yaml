    third_party_notice_file: THIRD_PARTY_NOTICES.md
    allow_project_owner_override: true
    branding_reserved: true
    compatibility:
      enabled: true
      wording: compatible with selected instruments
      trademark_owner: the original manufacturer
    safety_notice: 'This is a hardware/electronics project. Anyone building, modifying,
      testing, selling, or using the design is responsible for verifying isolation,
      creepage and clearance, electrical safety, regulatory compliance, manufacturability,
      and fitness for purpose.

      '
  internal-prototype:
    hardware_design_license: See LICENSE
    copyright_holder: ''
    notice_file: NOTICE.md
    third_party_notice_file: THIRD_PARTY_NOTICES.md
    allow_project_owner_override: false
    branding_reserved: false
    compatibility:
      enabled: false
      wording: ''
      trademark_owner: ''
    safety_notice: 'This is a hardware/electronics project. Anyone building, modifying,
      testing, selling, or using the design is responsible for verifying isolation,
      creepage and clearance, electrical safety, regulatory compliance, manufacturability,
      and fitness for purpose.

      '
