      testing, selling, or using the design is responsible for verifying isolation,
      creepage and clearance, electrical safety, regulatory compliance, manufacturability,
      and fitness for purpose.

      '
  compatibility-friendly:
    hardware_design_license: CERN-OHL-S-2.0
    copyright_holder: ''
